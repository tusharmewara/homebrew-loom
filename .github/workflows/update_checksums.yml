name: Update Formula Checksums

on:
  release:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for all bottles
        if: github.event_name == 'release'
        run: sleep 300

      - name: Extract version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update checksums
        run: |
          bash scripts/update_formula_checksums.sh ${{ steps.vars.outputs.version }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/loom.rb checksums.txt
          git commit -m "Update bottle checksums for v${{ steps.vars.outputs.version }}" || echo "No changes to commit"
          git push
